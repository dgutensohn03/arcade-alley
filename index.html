<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121421">
  <meta name="description" content="Arcade Alley: an original 8-bit arcade shooting gallery. Identify the threat, protect the bystander, and beat twelve waves.">
  <title>Arcade Alley · 8-bit arcade</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="cabinet">
    <header class="masthead"><span class="brand">◈ ARCADE ALLEY <small>EST. 2026</small></span><span class="status">PIXEL ACTION <i></i> IDENTIFY FIRST</span></header>
    <div class="screen-shell">
      <canvas id="game" width="480" height="270" tabindex="0" aria-label="Arcade Alley game. Click or tap threats, avoid civilians. Press R to reload, P to pause, M to mute, C to toggle the crosshair."></canvas>
      <div class="scanlines" aria-hidden="true"></div>
    </div>
    <div class="controlbar" aria-label="Game controls">
      <div class="buttons"><button id="start" type="button">START / RESTART</button><button id="reload" type="button">↻ RELOAD</button><button id="pause" type="button">Ⅱ PAUSE</button></div>
      <div class="buttons secondary"><button id="aim" type="button" aria-pressed="true">◎ AIM ASSIST ON</button><button id="sound" type="button" aria-pressed="true">♫ SOUND ON</button><button id="fullscreen" type="button">⛶ FULLSCREEN</button></div>
    </div>
    <div class="instructions"><p><strong>IDENTIFY FIRST. SHOOT SECOND.</strong> Red markers flag threats; civilians carry cameras, phones, instruments, and deliveries. Reload between waves.</p><p>CLICK / TAP fire <span>·</span> R reload <span>·</span> P pause <span>·</span> C aim <span>·</span> M sound <span>·</span> Rotate your phone for a larger playfield.</p></div>
    <p class="sr-only" id="announcer" aria-live="polite"></p>
  </main>
  <script src="logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
